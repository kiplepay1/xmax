<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTO VAULT AI — Complete Motorcycle Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a0c',
                            800: '#121316',
                            700: '#18191d',
                            600: '#27272a',
                            500: '#3f3f46'
                        },
                        mint: {
                            500: '#10b981',
                            400: '#34d399',
                            900: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0a0a0c; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="bg-dark-900 text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const LEGACY_DATA = {
            motorcycle: {
                model: "Yamaha XMAX V2",
                year: 2025,
                odometer: 17183,
                serviceInterval: 3000,
                nextServiceTarget: 20183
            },
            services: [
                { id: "srv-001", date: "2025-04-30", odometer: 211, description: "First service", cost: 0, parts: ["Engine Oil", "Oil Filter"], workshop: "Hong Leong Yamaha", flagged: false },
                { id: "srv-002", date: "2025-08-15", odometer: 4200, description: "Front tyre replacement", cost: 530, parts: ["Front Tyre"], workshop: "Tayar Motor Pro", flagged: true, flagReason: "Odometer anomaly: recorded after 3,000km service in sequence." },
                { id: "srv-003", date: "2025-09-10", odometer: 3000, description: "Regular service", cost: 120, parts: ["Engine Oil"], workshop: "Auto Care Services", flagged: false },
                { id: "srv-004", date: "2025-11-20", odometer: 6000, description: "Regular service", cost: 120, parts: ["Engine Oil", "Gear Oil"], workshop: "Auto Care Services", flagged: false },
                { id: "srv-005", date: "2026-01-15", odometer: 9100, description: "Regular service", cost: 120, parts: ["Engine Oil"], workshop: "Auto Care Services", flagged: false },
                { id: "srv-006", date: "2026-04-22", odometer: 13100, description: "Regular service and front brake pad", cost: 210, parts: ["Engine Oil", "Front Brake Pad"], workshop: "Yamaha Quality Workshop", flagged: false },
                { id: "srv-007", date: "2026-06-05", odometer: 15000, description: "Rear tyre replacement", cost: 330, parts: ["Rear Tyre"], workshop: "Tayar Motor Pro", flagged: false },
                { id: "srv-008", date: "2026-07-22", odometer: 17183, description: "Regular service", cost: 119, parts: ["Engine Oil", "Oil Filter"], workshop: "Yamaha Quality Workshop", flagged: false }
            ],
            fuel: [
                { id: "fuel-001", date: "2026-07-01", odometer: 16500, liters: 11.5, cost: 23.58 },
                { id: "fuel-002", date: "2026-07-15", odometer: 16850, liters: 12.0, cost: 24.60 },
                { id: "fuel-003", date: "2026-07-28", odometer: 17183, liters: 11.8, cost: 24.19 }
            ],
            expenses: [
                { id: "exp-001", date: "2026-01-05", category: "Insurance", description: "Annual Motorcycle Insurance", cost: 450 },
                { id: "exp-002", date: "2026-01-05", category: "Road Tax", description: "Annual Road Tax Renewal", cost: 50 },
                { id: "exp-003", date: "2026-03-10", category: "Accessories", description: "Phone Mount & Handlebar Grip", cost: 280 }
            ],
            rules: [
                { id: "rule-1", part: "Engine Oil", intervalKm: 3000, intervalMonths: 4, lastDoneKm: 17183 },
                { id: "rule-2", part: "Oil Filter", intervalKm: 6000, intervalMonths: 8, lastDoneKm: 17183 },
                { id: "rule-3", part: "Gear Oil", intervalKm: 6000, intervalMonths: 6, lastDoneKm: 6000 },
                { id: "rule-4", part: "Air Filter", intervalKm: 12000, intervalMonths: 12, lastDoneKm: 0 },
                { id: "rule-5", part: "Spark Plug", intervalKm: 10000, intervalMonths: 12, lastDoneKm: 0 },
                { id: "rule-6", part: "CVT Belt", intervalKm: 20000, intervalMonths: 24, lastDoneKm: 0 },
                { id: "rule-7", part: "CVT Rollers", intervalKm: 12000, intervalMonths: 12, lastDoneKm: 0 },
                { id: "rule-8", part: "Front Brake Pad", intervalKm: 10000, intervalMonths: 12, lastDoneKm: 13100 },
                { id: "rule-9", part: "Rear Brake Pad", intervalKm: 8000, intervalMonths: 12, lastDoneKm: 0 },
                { id: "rule-10", part: "Coolant", intervalKm: 12000, intervalMonths: 24, lastDoneKm: 0 },
                { id: "rule-11", part: "Brake Fluid", intervalKm: 12000, intervalMonths: 24, lastDoneKm: 0 },
                { id: "rule-12", part: "Tyres (Front/Rear)", intervalKm: 15000, intervalMonths: 24, lastDoneKm: 15000 }
            ]
        };

        function App() {
            const [activeTab, setActiveTab] = useState("dashboard");
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem("motovault_ai_v2_data");
                return saved ? JSON.parse(saved) : LEGACY_DATA;
            });
            const [confirmedOdo, setConfirmedOdo] = useState(data.motorcycle.odometer);
            
            // Modal states for adding new records
            const [showServiceModal, setShowServiceModal] = useState(false);
            const [newService, setNewService] = useState({ date: new Date().toISOString().split('T')[0], odometer: confirmedOdo, description: "", cost: "", parts: "", workshop: "" });

            useEffect(() => {
                localStorage.setItem("motovault_ai_v2_data", JSON.stringify(data));
            }, [data]);

            const totals = useMemo(() => {
                const totalService = data.services.reduce((acc, curr) => acc + curr.cost, 0);
                const totalFuel = data.fuel.reduce((acc, curr) => acc + curr.cost, 0);
                const totalExpenses = data.expenses.reduce((acc, curr) => acc + curr.cost, 0);
                return { totalService, totalFuel, totalExpenses, grandTotal: totalService + totalFuel + totalExpenses };
            }, [data]);

            const forecast = useMemo(() => {
                const nextTarget = confirmedOdo + (data.motorcycle.serviceInterval - (confirmedOdo % data.motorcycle.serviceInterval));
                const remainingKm = nextTarget - confirmedOdo;
                const dailyAvg = 25;
                const daysRemaining = Math.round(remainingKm / dailyAvg);
                const projectedDate = new Date();
                projectedDate.setDate(projectedDate.getDate() + daysRemaining);
                return { nextTarget, remainingKm, daysRemaining, projectedDate: projectedDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) };
            }, [confirmedOdo, data.motorcycle.serviceInterval]);

            const handleAddService = (e) => {
                e.preventDefault();
                const item = {
                    id: 'srv-' + Date.now(),
                    date: newService.date,
                    odometer: Number(newService.odometer),
                    description: newService.description,
                    cost: Number(newService.cost),
                    parts: newService.parts ? newService.parts.split(',').map(s => s.trim()) : [],
                    workshop: newService.workshop,
                    flagged: false
                };
                setData(prev => ({ ...prev, services: [item, ...prev.services] }));
                setShowServiceModal(false);
                setNewService({ date: new Date().toISOString().split('T')[0], odometer: confirmedOdo, description: "", cost: "", parts: "", workshop: "" });
            };

            const exportBackup = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `motovault_ai_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-dark-900 text-zinc-100">
                    <!-- Sidebar Navigation -->
                    <aside className="w-full md:w-64 bg-dark-800 border-b md:border-b-0 md:border-r border-dark-600 p-6 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center space-x-3 mb-8">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-mint-500 to-mint-400 flex items-center justify-center font-bold text-dark-900 text-xl">
                                    MV
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-none tracking-tight">MOTO VAULT <span className="text-mint-400">AI</span></h1>
                                    <p className="text-xs text-zinc-500 mt-1">Yamaha XMAX V2</p>
                                </div>
                            </div>

                            <nav className="space-y-2">
                                {[
                                    { id: "dashboard", label: "Dashboard" },
                                    { id: "services", label: "Service History" },
                                    { id: "rules", label: "Maintenance Rules" },
                                    { id: "fuel", label: "Fuel & Expenses" },
                                    { id: "migration", label: "Data Migration" }
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === tab.id ? "bg-mint-900/40 text-mint-400 border border-mint-500/30" : "text-zinc-400 hover:bg-dark-700 hover:text-zinc-200"}`}
                                    >
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="pt-6 border-t border-dark-600 space-y-3">
                            <button onClick={() => setShowServiceModal(true)} className="w-full py-2.5 px-4 rounded-lg bg-mint-500 hover:bg-mint-400 text-xs font-bold text-dark-900 transition-all flex items-center justify-center space-x-2">
                                <span>+ Add Service Record</span>
                            </button>
                            <button onClick={exportBackup} className="w-full py-2 px-4 rounded-lg bg-dark-700 hover:bg-dark-600 text-xs font-semibold text-zinc-300 border border-dark-600 transition-all flex items-center justify-center space-x-2">
                                <span>Export JSON Backup</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <main className="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full">
                        <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-dark-600 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold tracking-tight text-white capitalize">{activeTab.replace('-', ' ')}</h2>
                                <p className="text-sm text-zinc-400">Model Year: 2025 • Interactive Maintenance Tracker</p>
                            </div>
                            <div className="flex items-center space-x-4 bg-dark-800 px-4 py-2 rounded-xl border border-dark-600">
                                <div>
                                    <span className="text-xs text-zinc-400 block">Current Odometer</span>
                                    <input
                                        type="number"
                                        value={confirmedOdo}
                                        onChange={(e) => setConfirmedOdo(Number(e.target.value))}
                                        className="bg-transparent font-bold text-mint-400 text-lg w-28 focus:outline-none"
                                    />
                                    <span className="text-xs text-zinc-400">km</span>
                                </div>
                            </div>
                        </header>

                        {/* DASHBOARD TAB */}
                        {activeTab === "dashboard" && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-dark-800 p-5 rounded-xl border border-dark-600">
                                        <p className="text-xs font-medium text-zinc-400">Current Odometer</p>
                                        <p className="text-2xl font-extrabold text-white mt-1">{confirmedOdo.toLocaleString()} <span className="text-sm font-normal text-zinc-500">km</span></p>
                                    </div>
                                    <div className="bg-dark-800 p-5 rounded-xl border border-dark-600">
                                        <p className="text-xs font-medium text-zinc-400">Next Service Milestone</p>
                                        <p className="text-2xl font-extrabold text-mint-400 mt-1">{forecast.nextTarget.toLocaleString()} <span className="text-sm font-normal text-zinc-500">km</span></p>
                                    </div>
                                    <div className="bg-dark-800 p-5 rounded-xl border border-dark-600">
                                        <p className="text-xs font-medium text-zinc-400">Remaining Distance</p>
                                        <p className="text-2xl font-extrabold text-white mt-1">{forecast.remainingKm.toLocaleString()} <span className="text-sm font-normal text-zinc-500">km</span></p>
                                    </div>
                                    <div className="bg-dark-800 p-5 rounded-xl border border-dark-600">
                                        <p className="text-xs font-medium text-zinc-400">Total Lifetime Spend</p>
                                        <p className="text-2xl font-extrabold text-white mt-1">RM {totals.grandTotal.toLocaleString()}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-gradient-to-br from-dark-800 to-dark-700 p-6 rounded-xl border border-dark-600">
                                        <div className="flex items-center space-x-2 text-mint-400 mb-3">
                                            <span className="font-bold text-sm uppercase tracking-wider">⚡ AI Maintenance Forecast</span>
                                        </div>
                                        <p className="text-zinc-300 text-sm leading-relaxed">
                                            Based on historical riding telemetry, your Yamaha XMAX V2 averages approximately <strong className="text-white">25 km/day</strong>.
                                            At current consumption rates, your next scheduled <strong className="text-mint-400">3,000 km Service</strong> will be due on or around <strong className="text-white">{forecast.projectedDate}</strong>.
                                        </p>
                                    </div>

                                    <div className="bg-dark-800 p-6 rounded-xl border border-dark-600">
                                        <h3 className="font-bold text-base text-white mb-4">Cost Breakdown</h3>
                                        <div className="space-y-3 text-sm">
                                            <div className="flex justify-between items-center">
                                                <span className="text-zinc-400">Services & Repairs</span>
                                                <span className="font-semibold text-white">RM {totals.totalService}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-zinc-400">Fuel Purchases</span>
                                                <span className="font-semibold text-white">RM {totals.totalFuel.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-zinc-400">Insurance & Tax</span>
                                                <span className="font-semibold text-white">RM {totals.totalExpenses}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SERVICE HISTORY TAB */}
                        {activeTab === "services" && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-white">All Service Records ({data.services.length})</h3>
                                    <button onClick={() => setShowServiceModal(true)} className="px-4 py-2 bg-mint-500 text-dark-900 font-bold rounded-lg text-xs">
                                        + Add Record
                                    </button>
                                </div>
                                <div className="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-dark-700 text-zinc-400 text-xs uppercase">
                                            <tr>
                                                <th className="p-4">Date</th>
                                                <th className="p-4">Odometer</th>
                                                <th className="p-4">Description & Parts</th>
                                                <th className="p-4">Workshop</th>
                                                <th className="p-4 text-right">Cost</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-dark-600">
                                            {data.services.map((srv) => (
                                                <tr key={srv.id} className="hover:bg-dark-700/50 transition-colors">
                                                    <td className="p-4 font-medium text-zinc-200">{srv.date}</td>
                                                    <td className="p-4 text-zinc-300">
                                                        {srv.odometer.toLocaleString()} km
                                                        {srv.flagged && <span className="ml-2 px-2 py-0.5 text-[10px] bg-amber-500/20 text-amber-400 rounded border border-amber-500/30">Anomaly</span>}
                                                    </td>
                                                    <td className="p-4 text-zinc-300">
                                                        <div className="font-semibold text-white">{srv.description}</div>
                                                        <div className="text-xs text-zinc-500">{srv.parts && srv.parts.join(", ")}</div>
                                                    </td>
                                                    <td className="p-4 text-zinc-400">{srv.workshop}</td>
                                                    <td className="p-4 text-right font-bold text-mint-400">RM {srv.cost}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* MAINTENANCE RULES TAB */}
                        {activeTab === "rules" && (
                            <div className="space-y-4">
                                <h3 className="text-lg font-bold text-white">Periodic Maintenance Intervals & Component Health</h3>
                                <p className="text-sm text-zinc-400">Tracks remaining lifespan and interval status for all configured Yamaha XMAX V2 parts.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {data.rules.map((rule) => {
                                        const kmSince = confirmedOdo - rule.lastDoneKm;
                                        const remaining = Math.max(0, rule.intervalKm - kmSince);
                                        const pct = Math.min(100, Math.round((kmSince / rule.intervalKm) * 100));
                                        const isDue = remaining === 0;
                                        return (
                                            <div key={rule.id} className="bg-dark-800 p-5 rounded-xl border border-dark-600 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-center mb-2">
                                                        <h4 className="font-bold text-white text-base">{rule.part}</h4>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${isDue ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-mint-900/40 text-mint-400 border border-mint-500/30'}`}>
                                                            {isDue ? 'SERVICE DUE' : `${remaining.toLocaleString()} km left`}
                                                        </span>
                                                    </div>
                                                    <p className="text-xs text-zinc-400 mb-4">Interval: Every {rule.intervalKm.toLocaleString()} km / {rule.intervalMonths} mos</p>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-xs text-zinc-500 mb-1">
                                                        <span>Last Done: {rule.lastDoneKm.toLocaleString()} km</span>
                                                        <span>{pct}%</span>
                                                    </div>
                                                    <div className="w-full bg-dark-700 h-2 rounded-full overflow-hidden">
                                                        <div className={`h-full ${isDue ? 'bg-red-500' : 'bg-mint-400'}`} style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* FUEL & EXPENSES TAB */}
                        {activeTab === "fuel" && (
                            <div className="space-y-6">
                                <h3 className="text-lg font-bold text-white">Fuel Efficiency & General Expenses</h3>
                                <div className="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden p-6">
                                    <h4 className="font-semibold text-white mb-4">Fuel Logs ({data.fuel.length})</h4>
                                    <table className="w-full text-left text-sm mb-6">
                                        <thead className="bg-dark-700 text-zinc-400 text-xs uppercase">
                                            <tr>
                                                <th className="p-3">Date</th>
                                                <th className="p-3">Odometer</th>
                                                <th className="p-3">Litres</th>
                                                <th className="p-3 text-right">Cost</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-dark-600">
                                            {data.fuel.map((f) => (
                                                <tr key={f.id}>
                                                    <td className="p-3 text-zinc-200">{f.date}</td>
                                                    <td className="p-3 text-zinc-300">{f.odometer.toLocaleString()} km</td>
                                                    <td className="p-3 text-zinc-300">{f.liters} L</td>
                                                    <td className="p-3 text-right font-bold text-mint-400">RM {f.cost.toFixed(2)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>

                                    <h4 className="font-semibold text-white mb-4">General Expenses (Insurance, Road Tax, Accessories)</h4>
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-dark-700 text-zinc-400 text-xs uppercase">
                                            <tr>
                                                <th className="p-3">Date</th>
                                                <th className="p-3">Category</th>
                                                <th className="p-3">Description</th>
                                                <th className="p-3 text-right">Cost</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-dark-600">
                                            {data.expenses.map((e) => (
                                                <tr key={e.id}>
                                                    <td className="p-3 text-zinc-200">{e.date}</td>
                                                    <td className="p-3 text-mint-400 font-semibold">{e.category}</td>
                                                    <td className="p-3 text-zinc-300">{e.description}</td>
                                                    <td className="p-3 text-right font-bold text-white">RM {e.cost}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* MIGRATION TAB */}
                        {activeTab === "migration" && (
                            <div className="space-y-6">
                                <div className="bg-dark-800 p-6 rounded-xl border border-dark-600">
                                    <h3 className="text-lg font-bold text-white mb-2">Standalone Migration Engine</h3>
                                    <p className="text-sm text-zinc-400 mb-6">Imported from legacy source <code className="text-mint-400">motovault_xmax_v1_data</code>.</p>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                                        <div className="bg-dark-700 p-4 rounded-lg border border-dark-600">
                                            <span className="text-xs text-zinc-400 block">Service Entries</span>
                                            <span className="text-xl font-bold text-white">{data.services.length} Migrated</span>
                                        </div>
                                        <div className="bg-dark-700 p-4 rounded-lg border border-dark-600">
                                            <span className="text-xs text-zinc-400 block">Fuel Logs</span>
                                            <span className="text-xl font-bold text-white">{data.fuel.length} Migrated</span>
                                        </div>
                                        <div className="bg-dark-700 p-4 rounded-lg border border-dark-600">
                                            <span className="text-xs text-zinc-400 block">General Expenses</span>
                                            <span className="text-xl font-bold text-white">{data.expenses.length} Migrated</span>
                                        </div>
                                    </div>
                                    <button onClick={exportBackup} className="px-6 py-3 bg-mint-500 hover:bg-mint-400 text-dark-900 font-bold rounded-lg text-sm">
                                        Download Complete JSON Backup
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ADD SERVICE MODAL */}
                    {showServiceModal && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                            <div className="bg-dark-800 border border-dark-600 rounded-xl p-6 max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">Add New Service Record</h3>
                                <form onSubmit={handleAddService} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Date</label>
                                        <input type="date" value={newService.date} onChange={e => setNewService({...newService, date: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Odometer (km)</label>
                                        <input type="number" value={newService.odometer} onChange={e => setNewService({...newService, odometer: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Description</label>
                                        <input type="text" placeholder="e.g. Regular service & oil change" value={newService.description} onChange={e => setNewService({...newService, description: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Parts Replaced (comma separated)</label>
                                        <input type="text" placeholder="Engine Oil, Oil Filter" value={newService.parts} onChange={e => setNewService({...newService, parts: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Workshop Name</label>
                                        <input type="text" placeholder="Yamaha Service Center" value={newService.workshop} onChange={e => setNewService({...newService, workshop: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400 block mb-1">Cost (RM)</label>
                                        <input type="number" step="0.01" placeholder="120" value={newService.cost} onChange={e => setNewService({...newService, cost: e.target.value})} className="w-full bg-dark-700 border border-dark-600 rounded p-2 text-sm text-white" required />
                                    </div>
                                    <div className="flex space-x-3 pt-4">
                                        <button type="submit" className="flex-1 bg-mint-500 hover:bg-mint-400 text-dark-900 font-bold py-2 rounded text-sm">Save Record</button>
                                        <button type="button" onClick={() => setShowServiceModal(false)} className="flex-1 bg-dark-700 hover:bg-dark-600 text-zinc-300 font-bold py-2 rounded text-sm">Cancel</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
